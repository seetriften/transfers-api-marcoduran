services:

  mongodb:
    image: mongo:4.4
    container_name: transfers-mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: root
    volumes:
      - mongo_data:/data/db

  postgres:
    image: postgres:16-alpine
    container_name: transfers-postgres
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: transfers_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

  memcached:
    image: memcached:1.6-alpine
    container_name: transfers-memcached
    restart: always
    ports:
      - "11211:11211"
    command: ["memcached", "-m", "64", "-I", "4m"]
    volumes:
      - memcached_data:/data

  app:
    image: transfers-api:0.1.0
    build:
      context: .
      dockerfile: Dockerfile
    container_name: transfers-api
    depends_on:
      - mongodb
      - postgres
      - memcached
    ports:
      - "8080:8080"

    environment:
      # ---- Business ----
      TRANSFER_MIN_AMOUNT: 1
      STORAGE_ENGINE: ${STORAGE_ENGINE:-postgres}

      # ---- Mongo ----
      MONGODB_CONNECT_TIMEOUT: 10s
      MONGODB_HOSTNAME: mongodb
      MONGODB_PORT: 27017
      MONGODB_USERNAME: root
      MONGODB_PASSWORD: root
      MONGODB_DATABASE: transfers-db
      MONGODB_COLLECTION: transfers

      # ---- PostgreSQL ----
      POSTGRES_CONNECT_TIMEOUT: 10s
      POSTGRES_HOSTNAME: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USERNAME: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DATABASE: transfers_db
      POSTGRES_SSL_MODE: disable

      # ---- Memcached (cache-aside en el servicio) ----
      CACHE_ENABLED: "true"
      CACHE_HOST: memcached
      CACHE_PORT: 11211
      CACHE_CONNECT_TIMEOUT: 5s

    restart: always

volumes:
  mongo_data:
  postgres_data:
  memcached_data: